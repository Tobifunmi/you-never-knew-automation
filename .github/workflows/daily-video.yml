name: Daily Autonomous Video Generation

on:
  #schedule:
  #- cron: '0 10 * * 1,4'

  # Manual trigger button in GitHub Actions UI
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Kokoro model weights
        # Kokoro downloads ~327MB from Hugging Face on first use each
        # run; without caching, that download repeats every single
        # scheduled run forever. Keyed on requirements.txt so a version
        # bump there naturally invalidates a stale cache.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-hf-cache-${{ hashFiles('requirements.txt') }}

      - name: Download WordNet Corpus
        run: |
          python -c "import nltk; nltk.download('wordnet'); nltk.download('omw-1.4')"

      - name: Restore Persistent State Files
        env:
          TOPICS_JSON: ${{ secrets.TOPICS_JSON }}
          VIDEOS_JSON: ${{ secrets.VIDEOS_JSON }}
          TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          mkdir -p database
          if [ ! -f database/topics.json ] && [ -n "$TOPICS_JSON" ]; then echo "$TOPICS_JSON" > database/topics.json; fi
          if [ ! -f database/videos.json ] && [ -n "$VIDEOS_JSON" ]; then echo "$VIDEOS_JSON" > database/videos.json; fi
          if [ -n "$TOKEN_JSON" ]; then echo "$TOKEN_JSON" > token.json; fi

      - name: Execute Autonomous Video Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python main.py run --production

      - name: Commit Updated State Files Back to Repo
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add database/topics.json database/videos.json database/usage_log.json || true
          git commit -m "chore: update topics and videos state [skip ci]" || true
          git push || true